# Publishes the Socha Diff desktop app (ClickOnce) and the download site to
# https://sochadiff.socha3.com/ on every push to main (and on demand from main).
#
#   version = <major>.<minor>.<github.run_number>.0   (major/minor from desktop/version.json)
#             -> ClickOnce ApplicationVersion + MinimumRequiredVersion (installed clients update
#                at their next launch), assembly Version/FileVersion, site version.json.
#   build   = windows-latest: npm tests -> prepare-bundle -> VS MSBuild ClickOnce publish ->
#             desktop/out/site (publish-site.ps1), uploaded as an artifact.
#   signing = whenever secrets SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD exist (Socha3 cert,
#             expected thumbprint in vars.SIGNING_CERT_THUMBPRINT or the default below). A build
#             with the secrets that does not come out signed fails.
#   deploy  = self-hosted runner `socha3-sochadiff` on the IIS server (labels self-hosted, Windows,
#             X64, sochadiff), GitHub environment `production` (deployments allowed from main
#             only, no required reviewers): deploy-site.ps1 backs up C:\WebApps\SochaDiff to
#             C:\WebApps\_deploy-backups\SochaDiff, refuses non-newer versions (input `force`
#             overrides), robocopies without deleting (SochaDiff.application, version.json,
#             index.html last), then checks the live site through Cloudflare. No deploy secrets.
#             (Replaced the earlier Web Deploy/msdeploy job; see git history if it is ever needed.)
#   public  = this repository is PUBLIC. Runs of workflows from outside contributors' fork PRs
#             need maintainer approval (all_external_contributors). NEVER approve a fork PR's run
#             without reading every change to .github/ first: a fork can edit or add a workflow
#             whose job targets the self-hosted runner's labels and runs code on the web server.
# Setup, secrets and server details: desktop/README.md, "Continuous publishing".
name: Publish desktop app and site

# Deliberately no pull_request or feature-branch trigger: the deploy job writes to the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (only when run from main)"
        type: boolean
        default: true
      force:
        description: "Deploy even if the live site already reports the same or a newer version"
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time, queued; never cancel a run that may be mid-deploy.
concurrency:
  group: publish-desktop
  cancel-in-progress: false

jobs:
  build:
    name: Test, publish ClickOnce, assemble site
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7

      # Secrets cannot be used in `if:` directly, so test them here and expose a step output.
      - name: Check signing secrets
        id: gate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $signing = [bool]$env:SIGNING_PFX_BASE64 -and [bool]$env:SIGNING_PFX_PASSWORD
          Add-Content $env:GITHUB_OUTPUT "signing=$($signing.ToString().ToLower())"
          Write-Host "signing=$signing (ref $env:GITHUB_REF, event $env:GITHUB_EVENT_NAME)"
          if (-not $signing) { Write-Host '::warning::SIGNING_PFX_BASE64/SIGNING_PFX_PASSWORD not set: this release is UNSIGNED.' }

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = Get-Content desktop/version.json -Raw | ConvertFrom-Json
          $version = '{0}.{1}.{2}.0' -f [int]$v.major, [int]$v.minor, [int]$env:GITHUB_RUN_NUMBER
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Add-Content $env:GITHUB_OUTPUT "artifact=sochadiff-site-$version"
          Write-Host "Socha Diff $version"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # The selection tests drive Chromium via Playwright (they skip silently without it).
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test (selection)
        run: npm run test:selection

      - name: Test (path validation)
        run: npm run test:paths

      - uses: microsoft/setup-msbuild@v3

      - name: Decode signing certificate
        id: pfx
        if: steps.gate.outputs.signing == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sochadiff-signing-$([guid]::NewGuid().ToString('N')).pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:SIGNING_PFX_BASE64 -replace '\s', '')))
          Add-Content $env:GITHUB_OUTPUT "path=$pfx"

      # publish-site.ps1 imports the PFX into Cert:\CurrentUser\My for the build (signing with the
      # PFX's own thumbprint) and removes the certificate and its key afterwards. Signing covers
      # the ClickOnce manifests, SochaDiff.exe, the entry point assembly and setup.exe.
      - name: Publish ClickOnce and assemble site
        id: publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PFX_PATH: ${{ steps.pfx.outputs.path }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          # ClickOnce updates only work while every release is signed with the same certificate.
          EXPECTED_THUMBPRINT: ${{ vars.SIGNING_CERT_THUMBPRINT || 'CF4137053F371F439BD420B02A51192C5DED6075' }}
        run: |
          $params = @{ Version = $env:VERSION; InstallBootstrapperPackages = $true }
          if ($env:PFX_PATH) {
            $params.PfxPath = $env:PFX_PATH
            $params.PfxPassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $params.ExpectedCertificateThumbprint = $env:EXPECTED_THUMBPRINT
          }
          ./desktop/scripts/publish-site.ps1 @params

      - name: Require a signed release when the signing secrets exist
        if: steps.gate.outputs.signing == 'true' && steps.publish.outputs.signed != 'true'
        shell: pwsh
        run: |
          Write-Host '::error::SIGNING_PFX_BASE64/SIGNING_PFX_PASSWORD are set but publish-site.ps1 did not sign the release.'
          exit 1

      - name: Delete signing certificate file
        if: always() && steps.pfx.outputs.path != ''
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.pfx.outputs.path }}
        run: Remove-Item -Force -LiteralPath $env:PFX_PATH -ErrorAction SilentlyContinue

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: desktop/out/site/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to IIS (self-hosted runner on the web server)
    needs: build
    # Only for main: a push, or a manual run from main with `deploy` checked. Never for PRs or other
    # branches, because this job writes to the live site.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    # The `production` environment only accepts deployments from main (custom branch policy), a
    # second gate besides the `if:` above; it has no required reviewers, so merges deploy.
    environment:
      name: production
      url: https://sochadiff.socha3.com
    # Runner `socha3-sochadiff` on the IIS server: registered to this repository only, service
    # account .\gha-sochadiff (not admin, logon-restricted; Modify on C:\WebApps\SochaDiff and
    # C:\WebApps\_deploy-backups\SochaDiff), job-completed hook cleans the workspace. The repo is
    # public: never approve a fork PR's workflow run without reading every workflow change, since a
    # fork's workflow can target these labels.
    runs-on: [self-hosted, Windows, X64, sochadiff]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/scripts

      # RUNNER_TEMP is emptied for every job, so no files from an earlier run can mix in.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/site-out

      # Backup -> version guard -> robocopy without deletes (SochaDiff.application, version.json
      # and index.html last) -> check https://sochadiff.socha3.com/ -> job summary.
      # Windows PowerShell 5.1 (always present on the server; pwsh is not required).
      - name: Deploy ${{ needs.build.outputs.version }} to C:\WebApps\SochaDiff
        shell: powershell
        env:
          VERSION: ${{ needs.build.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          ./desktop/scripts/deploy-site.ps1 `
            -Source (Join-Path $env:RUNNER_TEMP 'site-out') `
            -ExpectedVersion $env:VERSION `
            -TargetPath 'C:\WebApps\SochaDiff' `
            -BackupRoot 'C:\WebApps\_deploy-backups\SochaDiff' -KeepBackups 5 `
            -SiteUrl 'https://sochadiff.socha3.com/' `
            -Force:($env:FORCE -eq 'true') -Verify
