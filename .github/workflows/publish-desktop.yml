# Publishes the Socha Diff desktop app (ClickOnce) and the download site to
# https://sochadiff.socha3.com/ on every push to main (and on demand).
#
#   version = <major>.<minor>.<github.run_number>.0   (major/minor from desktop/version.json)
#             -> ClickOnce ApplicationVersion + MinimumRequiredVersion (installed clients update
#                at their next launch), assembly Version/FileVersion, site version.json.
#   build   = npm tests -> prepare-bundle -> VS MSBuild ClickOnce publish -> desktop/out/site
#             (publish-site.ps1), uploaded as an artifact.
#   signing = optional: only when secrets SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD exist.
#   deploy  = only when secrets DEPLOY_HOST, DEPLOY_SITE, DEPLOY_USER and DEPLOY_PASSWORD all
#             exist: two-phase Web Deploy sync (SochaDiff.application last) via deploy-site.ps1.
#             Repository variable DEPLOY_ALLOW_UNTRUSTED=true accepts a self-signed WMSvc cert.
# Setup, secrets and IIS server prep: desktop/README.md, "Continuous publishing".
name: Publish desktop app and site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (only from main, and only if the DEPLOY_* secrets exist)"
        type: boolean
        default: true
      force:
        description: "Deploy even if the live site already reports the same or a newer version"
        type: boolean
        default: false
      allow_untrusted:
        description: "Pass -allowUntrusted to msdeploy (self-signed Web Management Service certificate)"
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time, queued; never cancel a run that may be mid-deploy.
concurrency:
  group: publish-desktop
  cancel-in-progress: false

jobs:
  build:
    name: Test, publish ClickOnce, assemble site
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      # Secrets cannot be used in `if:` directly, so test them here and expose step outputs.
      - name: Check optional secrets (signing, deploy)
        id: gate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SITE: ${{ secrets.DEPLOY_SITE }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          WANT_DEPLOY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy) }}
        run: |
          $signing = [bool]$env:SIGNING_PFX_BASE64 -and [bool]$env:SIGNING_PFX_PASSWORD
          $deploySecrets = [bool]$env:DEPLOY_HOST -and [bool]$env:DEPLOY_SITE -and [bool]$env:DEPLOY_USER -and [bool]$env:DEPLOY_PASSWORD
          $deploy = $deploySecrets -and $env:WANT_DEPLOY -eq 'true'
          Add-Content $env:GITHUB_OUTPUT "signing=$($signing.ToString().ToLower())"
          Add-Content $env:GITHUB_OUTPUT "deploy=$($deploy.ToString().ToLower())"
          Write-Host "signing=$signing deploy-secrets=$deploySecrets deploy=$deploy (ref $env:GITHUB_REF, event $env:GITHUB_EVENT_NAME)"
          if (-not $signing) { Write-Host '::notice::SIGNING_PFX_BASE64/SIGNING_PFX_PASSWORD not set: this release is unsigned.' }
          if (-not $deploySecrets) { Write-Host '::notice::DEPLOY_HOST/DEPLOY_SITE/DEPLOY_USER/DEPLOY_PASSWORD not all set: build only, no deploy.' }

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = Get-Content desktop/version.json -Raw | ConvertFrom-Json
          $version = '{0}.{1}.{2}.0' -f [int]$v.major, [int]$v.minor, [int]$env:GITHUB_RUN_NUMBER
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Add-Content $env:GITHUB_OUTPUT "artifact=sochadiff-site-$version"
          Write-Host "Socha Diff $version"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # The selection tests drive Chromium via Playwright (they skip silently without it).
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test (selection)
        run: npm run test:selection

      - name: Test (path validation)
        run: npm run test:paths

      - uses: microsoft/setup-msbuild@v3

      - name: Decode signing certificate
        id: pfx
        if: steps.gate.outputs.signing == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sochadiff-signing-$([guid]::NewGuid().ToString('N')).pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:SIGNING_PFX_BASE64 -replace '\s', '')))
          Add-Content $env:GITHUB_OUTPUT "path=$pfx"

      # publish-site.ps1 imports the PFX into Cert:\CurrentUser\My for the build and removes the
      # certificate and its key afterwards. Signing covers the ClickOnce manifests, SochaDiff.exe,
      # the entry point assembly and setup.exe.
      - name: Publish ClickOnce and assemble site
        id: publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PFX_PATH: ${{ steps.pfx.outputs.path }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $params = @{ Version = $env:VERSION; InstallBootstrapperPackages = $true }
          if ($env:PFX_PATH) {
            $params.PfxPath = $env:PFX_PATH
            $params.PfxPassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          }
          ./desktop/scripts/publish-site.ps1 @params

      - name: Delete signing certificate file
        if: always() && steps.pfx.outputs.path != ''
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.pfx.outputs.path }}
        run: Remove-Item -Force -LiteralPath $env:PFX_PATH -ErrorAction SilentlyContinue

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: desktop/out/site/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to IIS (Web Deploy)
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/scripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: site-out

      - name: Ensure Web Deploy (msdeploy.exe)
        shell: pwsh
        run: |
          $paths = "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe", "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if ($paths | Where-Object { Test-Path $_ }) { Write-Host 'Web Deploy is installed.'; exit 0 }
          choco install webdeploy -y --no-progress
          if (-not ($paths | Where-Object { Test-Path $_ })) { throw 'Web Deploy installation failed.' }

      # Phase 1 uploads everything except SochaDiff.application, phase 2 the manifest, so a client
      # never reads a manifest that points at files that are not there yet. Nothing is deleted.
      - name: Deploy ${{ needs.build.outputs.version }}
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SITE: ${{ secrets.DEPLOY_SITE }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          ALLOW_UNTRUSTED: ${{ inputs.allow_untrusted || vars.DEPLOY_ALLOW_UNTRUSTED == 'true' }}
          FORCE: ${{ inputs.force }}
        run: |
          ./desktop/scripts/deploy-site.ps1 -Source site-out -Mode WebDeploy `
            -ServerHost $env:DEPLOY_HOST -SiteName $env:DEPLOY_SITE `
            -AllowUntrusted:($env:ALLOW_UNTRUSTED -eq 'true') -Force:($env:FORCE -eq 'true')

  # ---------------------------------------------------------------------------------------------
  # ALTERNATIVE: self-hosted runner on the IIS server (no Web Deploy, no port 8172, no deploy
  # secrets). Register a runner on the server with the labels below (Settings > Actions > Runners
  # > New self-hosted runner, add label "sochadiff"), running as a service account that can
  # write to C:\WebApps\SochaDiff (the IIS site's physical path). Then replace the `deploy` job
  # above with this one (and drop DEPLOY_* from the gate step if you like). deploy-site.ps1
  # -Mode Copy robocopies everything except SochaDiff.application first, then the manifest.
  # Keep the runner dedicated to this private repository: a self-hosted runner executes the
  # workflow code of whatever it is given.
  #
  # deploy-self-hosted:
  #   name: Deploy to IIS (self-hosted runner)
  #   needs: build
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: [self-hosted, windows, sochadiff]
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         sparse-checkout: desktop/scripts
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: ${{ needs.build.outputs.artifact }}
  #         path: site-out
  #     - name: Copy ${{ needs.build.outputs.version }} to C:\WebApps\SochaDiff
  #       shell: powershell
  #       run: ./desktop/scripts/deploy-site.ps1 -Source site-out -Mode Copy -TargetPath 'C:\WebApps\SochaDiff'
